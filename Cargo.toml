[package]
name = "cooldown-registry-proxy"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A single-binary npm, PyPI, and Cargo registry proxy with enforceable dependency cooldowns"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-cooldown-registry-proxy"
readme = "README.md"
keywords = ["supply-chain", "registry", "proxy", "security", "cooldown"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tiny_http = "0.12"
urlencoding = "2.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

